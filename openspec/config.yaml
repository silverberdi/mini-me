schema: spec-driven

context: |
  Product: mini me.
  Purpose: personal single-installation Linux orchestrator for spec-driven software development across multiple repositories.
  Source-of-truth boundaries: GitHub Projects/Issues = portfolio/work visibility; OpenSpec = behavior/design/tasks; PostgreSQL = runtime state/events/evidence/metrics; Git = code/candidate evidence; host secret files = credentials.
  Stack direction: Python 3.12+, FastAPI, Pydantic v2, PostgreSQL, SQLAlchemy 2.x, Alembic, asyncio subprocesses, pytest, Ruff; Textual TUI later; containerized previews/deployments.
  Primary agents: Codex and Antigravity execute installed native OpenSpec agent workflows as proposer/implementer/verifier/reviewer/closer by stage, with independently assigned reviewer identity. mini me only orchestrates; it must NOT generate planning artifacts via own Python templates, author code, or emulate native spec sync/archive. DeepSeek Direct and OpenRouter are alternative providers only after both primaries cannot serve the stage, with explicit operator authorization, budget and real tool compatibility; no routine mandatory DeepSeek audit. Same model may not implement and authoritatively review its own candidate. Qwen is advisory only.
  Human authority: final product judgment, UI validation, merge, material ambiguity, policy/budget override and rollback.
  Repository identity: execution derives only from validated durable project binding; never infer repo from titles/labels/Project fields.
  Deployment: container-first. Human validation is for UI and must be guided by explicit scenarios. Validation is bound to candidate head SHA + base SHA and immutable image digest where applicable.
  Engineering rule: docs/ENGINEERING_DISCIPLINE.md (founding discipline plus same-change code retirement) is mandatory. Capability seed: docs/agent-capabilities/V1_MANIFEST.md, HOOK_CONTRACTS.md, HARNESS_CONTRACT.md, RETIREMENT_MAP.md and skills in .agent/.agents are prebuilt inputs, not instructions to infer from scratch. PR #140 hooks are pending, not assumed installed.
  Delivery rule: only the active OpenSpec change may be implemented; docs/BACKLOG.md MM-R01..R10 and docs/backlog/MM-Rxx.md define backlog value increments, not active changes. Each Change must include *all* functional specs necessary for real deployed value, stage E2E, full E2E, and functional postdeploy verification. docs/CHANGE_DELIVERY_CONTRACT.md is mandatory. Historical milestone DELIVERED labels do not prove product readiness.
  Verification guidance: verify observable specs, deterministic checks, denial/failure scenarios, scope, canonical architecture, and post-retirement E2E evidence. Distinguish TECHNICAL_PASS, real E2E evidence, and DEPLOYED_VERIFIED; missing evidence is BLOCKED, never inferred PASS. Do not accept self-review, paid fallback without authorization, secret exposure, repository mismatch, or stale human validation.

rules:
  proposal:
    - State the independently verifiable user/operator value and why this stage is now.
    - Load corresponding docs/backlog/MM-Rxx.md, docs/ENGINEERING_DISCIPLINE.md and docs/agent-capabilities/V1_MANIFEST.md. For MM-R01 load docs/agent-capabilities/R01_IMPLEMENTATION_STARTER.md and verify its preliminary code census against actual repository. Trace every Sxx/E0x to proposal/design/specs/tasks; stop for material ambiguity, don't invent scope.
    - Declare the smallest usable vertical slice, not technical sub-stages; include backend/DB/UI/hooks/harness and E2E in the **same Change** when required for value.
    - Declare dependencies and explicitly identify non-goals/future stages to prevent scope creep.
    - Identify whether the change affects UI and therefore requires human validation scenarios.
    - Identify security, provider-cost, repository-binding and deployment impact where applicable.
  specs:
    - Write observable SHALL/SHALL NOT requirements with concrete scenarios for critical paths and denial/failure behavior.
    - Include real agent/official OpenSpec workflow evidence scenarios where relevant, plus adversarial stage E2E, outcome E2E and postdeployment functional E2E.
    - Never encode runtime retry/quota/process state into OpenSpec as mutable operational data.
    - For UI human validation, specify what the human tests, prerequisites, steps and expected visible outcomes.
    - Include explicit safety requirements for repository identity, secrets, paid fallback, candidate identity or production data when affected.
  design:
    - Resolve implementation-shaping architecture decisions; do not leave the executor to invent them.
    - Reuse the pre-seeded .agent/.agents skills/workflow wrappers and docs/agent-capabilities/ contracts, checking actual installed versions; complement them only where the active Change demonstrates a gap. Prefer official OpenSpec CLI/agent workflows; never emulate their semantics.
    - Include an explicit Removal Ledger of replaced writers/entrypoints/callers, migration of consumers/docs/tests, preservation of historical data, rollback and re-proving all E2E after retiring obsolete code in the same Change.
    - Preserve daemon/core ownership of orchestration; clients do not invoke providers/Git/deployment directly.
    - PostgreSQL is the only operational DB and schema changes use Alembic migrations.
    - Prefer idempotent/reconcilable external side effects and durable evidence before/after them.
    - Explain rollback/recovery implications for deployment or migration changes.
  tasks:
    - Keep tasks small, ordered, testable and attributable to this change only.
    - Every task must have a verifiable completion signal; include acceptance/failure-injection tasks.
    - Explicit tasks required for stage E2E, real end-to-end value proof, postdeploy E2E and regression of earlier delivered capabilities; no mock-only acceptance.
    - "Include same-Change code retirement tasks when replacing behavior: census, parity proof, consumer migration, removal, post-removal E2E and deployment verification; RETAIN-WITH-REASON needs explicit human approval."
    - Do not add tasks from future roadmap stages merely because they are convenient.

operations:
  apply:
    guidance:
      - Read AGENTS.md, docs/ENGINEERING_DISCIPLINE.md, docs/agent-capabilities/ contracts, seeded project agent skills, canonical docs and the MM-Rxx dossier before editing.
      - Execute native installed agent-side OpenSpec workflows, never free-form code implementation prompts or deterministic mini me-authored proposals/sync/archive.
      - Work only in the assigned repository/worktree and active change; stop on material ambiguity rather than inventing behavior, architecture, cost policy or repo identity.
      - Run focused tests/checks as work progresses and preserve evidence; never merge, weaken policy, expose secrets or bypass mandatory human validation.
      - Use the active change tasks as execution order but specs as behavioral authority.
      - Keep changes focused and reversible.
  archive:
    guidance:
      - Archive only after mini me Definition of Done conditions applicable to the stage are satisfied and closure evidence exists.

githubCopilot:
  cloudAgent: false
