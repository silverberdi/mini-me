schema: spec-driven

context: |
  MINI ME — CONTRATO RECTOR V1.3 (docs/CONTRATO_RECTOR.md). Esta referencia prevalece sobre planes heredados incompatibles.
  Objetivo: una gacela, no un paquidermo. Aplicación personal única, pequeña, FastAPI modular + PostgreSQL mínimo, que coordina agentes con workflows NATIVOS OpenSpec; mini me NO programa ni emula propose/update/apply/verify/sync/archive.
  Proveedores: agente/modelo de pensamiento, ejecución, revisión independiente y respaldo configurables por proyecto; medium por defecto en propose/apply/verify/review, esfuerzo mínimo compatible en sync/archive; no hardcodear Codex/AGY/DeepSeek/OpenRouter como roles permanentes.
  Fuente de tickets remota y autoritativa: GitHub inicialmente. Contratos distintos para tickets y Git/PR; sin cola duplicada DB. Selección del ticket elegible más antiguo por fecha + ID; un cambio activo por proyecto; no scoring ni scheduler complejo.
  Ciclo: explore → propose → validación CLI → complejidad → revisión independiente de propuesta (solo alta) → apply con pruebas obligatorias → verify por ejecutor → revisión independiente de código (solo alta) → PR1 de implementación (merge automático baja/mod, acuse humano «Estoy enterado» alta) → rama fresca documental doc-close → sync/archive nativos → PR2 documental (merge automático) → cierre remoto del ticket → siguiente ticket FIFO.
  Human-in-the-loop: capturar texto/opciones originales de OpenSpec; si hay opciones mostrarlas; sin opciones, pensamiento resuelve desde ticket/contexto si tiene información y autoridad; de otro modo consulta al humano con opciones etiquetadas y reanuda sin perder progreso. Jamás autoautorizar decisiones humanas, costos excepcionales, seguridad o merge de implementación.
  Fuentes: tickets/comentarios en GitHub; código en Git; specs en OpenSpec; PR/merges en proveedor Git; PostgreSQL solo configuración, checkpoint, gasto y decisiones mínimas; secretos fuera de repo.
  Fuera de alcance: despliegue productivo; pertenece al CI/CD del proyecto. Pruebas relevantes y E2E real antes de merge sí obligatorios.
  Ingeniería: POO real, SOLID, DRY, KISS, YAGNI; no clases gigantes, duplicación, motores ni estados no necesarios; retirar código/DB obsoleto en la fase asignada con migraciones seguras.
  PLAN DE RECONSTRUCCIÓN EXACTO 6 CHANGES (cada fase un Change con una o varias specs):
  F1 gacela-01-depuracion-inicial, issue #169, elimina emulaciones y lógica/DB obsoleta.
  F2 gacela-02-proyectos, issue #170, configuración y fuente tickets Github.
  F3 gacela-03-openspec-y-revision, issue #171, flujo real completo y revisión.
  F4 gacela-04-skills-base, issue #172, catálogo mínimo de skills reutilizables.
  F5 gacela-05-ui-self-hosted, issue #173, UI y ejecución del Change POR MINI ME.
  F6 gacela-06-depuracion-final, issue #174, segunda depuración POR MINI ME.
  F1-F4 se ejecutan externamente; F5-F6 mini me debe ejecutar sus propios Changes con agentes reales. Orden estricto; no dividir fases en microchanges; no anticipar fases futuras.
  Leer docs/CONTRATO_RECTOR.md, docs/BACKLOG.md, docs/RECONCILIACION_LEGADO.md y AGENTS.md ANTES de proponer.
  La antigua dirección R01-R10, N01-N05 y postdeploy obligatorio ha sido sustituida. Los archivos históricos pueden contener requisitos contradictorios NO vigentes; no reinterpretarlos como autoridad actual.
  Aprobar contexto NO autoriza ejecutar agentes, migraciones, despliegues, cerrar issues heredados, iniciar scheduler ni fusionar PR.

rules:
  proposal:
    - Usar únicamente el Change de la fase autorizada de las seis; un Change puede incluir múltiples specs; no crear microchanges.
    - Analizar código, consumidores, documentación y DB reales antes de definir diseño; rastrear responsabilidades existentes para REUSAR o RETIRAR.
    - No inventar funcionalidades, proveedores ni workflows; demostrar valor y alcance de la fase y criterios E2E correspondientes.
    - Reconciliar contradicciones con docs/CONTRATO_RECTOR.md y documentar las heredadas; no derivar autoridad de los dossiers R01-R10.
  specs:
    - Requisitos observables SHALL/SHALL NOT y escenarios reales de éxito/fallo, cuota, permisos e intervención humana si aplican.
    - Especificar exclusivamente la fase actual; preservar tests E2E de agentes reales y CI/UX cuando correspondan; despliegue productivo NO es responsabilidad de mini me.
    - No introducir estados/entidades operativas superfluas en OpenSpec.
  design:
    - Reutilizar skills oficiales instaladas; mini me no reimplementa semántica OpenSpec ni crea prompts sustitutos.
    - POO, SOLID, DRY, KISS, YAGNI; una sola API; contratos pequeños para adaptadores y dependencias explícitas.
    - Identificar escrituras/consumidores antiguos, migraciones DB seguras, retención de datos y retirada de código muerto dentro de la fase.
    - Conservar seguridad de repositorio, decisiones humanas, identidad de candidato, gasto autorizado e idempotencia mínima; no capas nuevas sin justificación.
  tasks:
    - Todas las tareas de la fase en UN Change, ordenadas y con señales verificables; no arrastrar fases futuras.
    - Incluir integración y E2E reales pertinentes, además de eliminación de consumidores/código/DB obsoletos del alcance.
    - Fase 5 y 6 requieren evidencia de que mini me orquestó en realidad su propio Change.
operations:
  apply:
    guidance:
      - Leer AGENTS.md y contrato rector; ejecutar skill OpenSpec nativa del agente, no emulación Python.
      - Mantener rama/worktree del Change, priorizar integración real y eliminar código viejo sustituido.
      - Preservar cuotas, secretos, permiso humano para merge de implementación y continuidad.
  archive:
    guidance:
      - Confirmar merge de implementación autorizado y cierre nativo; seguir la ruta PR documental y cierre del ticket descrita en el contrato, sin auto-merge general.
githubCopilot:
  cloudAgent: false
