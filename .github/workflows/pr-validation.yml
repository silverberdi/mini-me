name: PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-validation:
    name: Backend validation (pytest & migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: minime_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout pull request commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run database migrations
        env:
          MINIME_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/minime_test
          MINIME_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/minime_test
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/minime_test
        run: |
          alembic upgrade head

      - name: Run backend test suite
        env:
          MINIME_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/minime_test
          MINIME_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/minime_test
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/minime_test
          MINIME_JWT_SECRET: test-secret-key-for-pr-validation-only-not-for-prod
        run: |
          pytest

  frontend-validation:
    name: Frontend validation (tests & build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Compile Angular application
        working-directory: frontend
        run: npm run build

  pr-gate:
    name: PR validation gate
    needs:
      - backend-validation
      - frontend-validation
    runs-on: ubuntu-latest
    steps:
      - name: PR validation summary
        run: |
          echo "All PR validation checks passed successfully for candidate SHA: ${{ github.event.pull_request.head.sha || github.sha }}"
